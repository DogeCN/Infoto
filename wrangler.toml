# Wrangler configuration for Infoto.
# NOTE: `name`, `database_name` and `database_id` below are placeholders —
# the GitHub Actions deploy workflow patches them per deploy target
# (tag v* -> "infoto" production, branch -> "infoto-dev" test).
name = "infoto-dev"
main = "src/worker/index.ts"
compatibility_date = "2026-08-01"

[assets]
directory = "dist"
binding = "ASSETS"
# Cloudflare checks static assets before the Worker. A request the asset layer does not
# serve never reaches the Worker, and the two ways it declines differ in a way that matters:
#
#   - a browser navigation is answered by `not_found_handling` with index.html, *without*
#     invoking the Worker, so a copied /l/<id36> link came back as the SPA shell and the
#     SPA (which knows only `/` and `/admin`) rendered its own 404;
#   - a non-GET/HEAD request gets a bare 405 with an empty body, so every API write failed
#     while GETs kept working — /sync, /admin/announcements, /admin/polls, /admin/feedback.
#
# A curl without the Sec-Fetch-* headers is not a navigation and skipped the first path, and
# wrangler dev routes everything to the Worker, so neither reproduces locally.
#
# `run_worker_first` therefore lists *every* path the Worker serves, not only the ones a
# browser navigates to. Keep it in step with the route table in src/worker/app.ts and
# src/worker/routes/admin.ts — src/worker/assets-routing.test.ts fails when a route is
# missing here. `/` and `/admin` stay with the asset layer: that is what serves the SPA shell.
#
# Each collection base is listed twice, bare and with `/*`: Cloudflare does not document
# whether `*` crosses `/`, so a sub-resource like /admin/polls/12 is only guaranteed to
# match by having both forms present.
run_worker_first = [
  "/sync",
  "/l/*",
  "/robots.txt",
  "/admin/migrate",
  "/admin/announcements",
  "/admin/announcements/*",
  "/admin/polls",
  "/admin/polls/*",
  "/admin/feedback",
  "/admin/feedback/*",
  "/admin/translate",
]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "infoto-dev"
database_id = "00000000-0000-0000-0000-000000000000"

# Admin draft translation (POST /admin/translate). Workers AI has no local
# simulation, so the binding is explicitly remote; this only silences the
# local-dev warning and documents the intent. Calls still use the account's
# Workers AI quota even under `wrangler dev`.
[ai]
binding = "AI"
remote = true
