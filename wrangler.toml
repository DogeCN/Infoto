# Wrangler configuration for Infoto.
# NOTE: `name`, `database_name` and `database_id` below are placeholders —
# the GitHub Actions deploy workflow patches them per deploy target
# (tag v* -> "infoto" production, branch -> "infoto-dev" test).
name = "infoto-dev"
main = "src/worker/index.ts"
compatibility_date = "2026-08-01"

[assets]
directory = "dist"
binding = "ASSETS"
# Cloudflare checks static assets before the Worker, and `not_found_handling` answers a request
# that matches no asset by returning index.html. For a browser navigation it does that **without
# invoking the Worker at all** — so a copied /l/<id36> link opened in the address bar came back as
# the SPA shell, and the SPA (which knows only `/` and `/admin`) rendered its own 404 page. `curl`
# without the Sec-Fetch-* headers still reached the Worker and got the image, which is why the bug
# looked unreproducible from the terminal.
#
# These are the Worker-owned paths a browser navigates to. `/` and `/admin` deliberately stay with
# the asset layer: that is what serves the SPA shell.
run_worker_first = ["/l/*", "/robots.txt", "/admin/migrate"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "infoto-dev"
database_id = "00000000-0000-0000-0000-000000000000"
