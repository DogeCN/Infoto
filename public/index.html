<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0a0e1a" />
<title>Infoto</title>
<style>
/* =========================================================
   Infoto - 暗黑科技风 · 扁平化 · 响应式
   ========================================================= */
:root {
  /* 品牌色 */
  --primary: #22d3ee;
  --primary-container: #083344;
  --on-primary: #042f2e;
  /* 背景/表面 */
  --bg: #0a0e1a;
  --surface-lowest: #060a14;
  --surface: #0f1524;
  --surface-container: #151c2e;
  --surface-high: #1a2238;
  --surface-highest: #242d47;
  /* 文字 */
  --on-surface: #e2e8f0;
  --on-variant: #7b85a0;
  /* 功能色 */
  --success: #10b981;
  --error: #f43f5e;
  --warning: #f59e0b;
  /* 边框 */
  --outline: #2a3550;
  --outline-variant: #1e2640;
  /* 圆角 */
  --r-sm: 0.25rem; --r-md: 0.5rem; --r-lg: 0.75rem; --r-xl: 1rem; --r-2xl: 1.5rem;
  /* 阴影 */
  --shadow-card: 0 1px 3px rgba(0,0,0,.4), 0 0 0 1px rgba(34,211,238,.05);
  --shadow-float: 0 10px 30px rgba(0,0,0,.5), 0 0 20px rgba(34,211,238,.08);
  --shadow-dialog: 0 25px 60px rgba(0,0,0,.7), 0 0 40px rgba(34,211,238,.1);
  --shadow-glow: 0 0 20px rgba(34,211,238,.3);
  --font: "Space Grotesk","Inter","Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body {
  background: var(--bg);
  color: var(--on-surface);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-user-select: none; user-select: none;
  overflow-x: hidden;
}
img { -webkit-user-drag: none; user-drag: none; }
button { font-family:inherit; border:none; background:none; color:inherit; cursor:pointer; }
button:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }

::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:var(--outline); border-radius:4px; }
::-webkit-scrollbar-thumb:hover { background:rgba(34,211,238,.4); }

.icon { width:1.25em; height:1.25em; flex-shrink:0; }
.icon-sm { width:1em; height:1em; }
.icon-lg { width:1.75em; height:1.75em; }

/* 滚动隐藏 */
.scrollbar-hide::-webkit-scrollbar { display:none; }
.scrollbar-hide { -ms-overflow-style:none; scrollbar-width:none; }

/* 骨架 */
@keyframes shimmer { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
.skeleton {
  background:linear-gradient(90deg, var(--surface-container) 0%, var(--surface-high) 50%, var(--surface-container) 100%);
  background-size:800px 100%; animation:shimmer 1.5s infinite linear;
  border-radius:var(--r-lg);
}
@keyframes fadeIn { from{opacity:0; transform:scale(.98)} to{opacity:1; transform:scale(1)} }
.img-fade { animation:fadeIn .4s ease forwards; }

/* ============ 顶部导航 ============ */
header {
  position:fixed; top:0; left:0; right:0; z-index:50;
  height:3.5rem; display:flex; align-items:center; justify-content:space-between;
  padding:0 .75rem;
  background:rgba(10,14,26,.82);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid rgba(30,38,64,.3);
}
@media(min-width:768px){ header{ height:4rem; padding:0 1.5rem; } }
.header-title {
  position:absolute; left:50%; transform:translateX(-50%);
  font-size:.875rem; font-weight:600; letter-spacing:.05em;
  color:rgba(226,232,240,.9); display:flex; align-items:center; gap:.5rem; pointer-events:none;
  white-space:nowrap;
}
.header-title .icon { color:var(--primary); display:none; }
@media(min-width:768px){ .header-title .icon{ display:block; } }

/* 排序胶囊 */
.sort-group {
  display:flex; align-items:center; gap:.25rem;
  background:var(--surface-container); border:1px solid rgba(30,38,64,.4);
  border-radius:9999px; padding:.125rem;
}
.sort-btn {
  display:flex; align-items:center; gap:.3rem;
  padding:.4rem .75rem; border-radius:9999px;
  font-size:.75rem; font-weight:500; color:var(--on-variant);
  transition:all .2s; white-space:nowrap;
}
@media(min-width:768px){ .sort-btn{ font-size:.875rem; padding:.5rem .9rem; } }
.sort-btn:hover { color:var(--on-surface); }
.sort-btn.active { background:var(--primary); color:var(--on-primary); }

/* 右侧按钮 */
.nav-actions { display:flex; align-items:center; gap:.25rem; }
@media(min-width:768px){ .nav-actions{ gap:.5rem; } }
.nav-btn {
  padding:.45rem; border-radius:.5rem; color:var(--on-variant);
  transition:all .2s; display:flex; align-items:center; justify-content:center;
}
.nav-btn:hover { color:var(--on-surface); background:var(--surface-container); }
.nav-btn.upload:hover { color:var(--primary); background:rgba(34,211,238,.1); }

/* ============ 主内容 ============ */
main { padding:4.5rem .75rem 4rem; min-height:100vh; }
@media(min-width:768px){ main { padding:5.5rem 1.5rem 4rem; } }

/* 空态 */
.empty {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:6rem 1rem; text-align:center; color:var(--on-variant);
}
.empty .circle {
  width:5rem; height:5rem; border-radius:50%;
  background:var(--surface-container); display:flex; align-items:center; justify-content:center;
  margin-bottom:1rem; color:rgba(123,133,160,.6);
}
.empty .circle .icon { width:2.5rem; height:2.5rem; }

/* ============ 瀑布流（列容器法） ============ */
.masonry {
  display:flex; gap:.75rem; align-items:flex-start;
}
@media(min-width:768px){ .masonry{ gap:1rem; } }
.masonry-col { display:flex; flex-direction:column; gap:.75rem; min-width:0; flex:1; }
@media(min-width:768px){ .masonry-col{ gap:1rem; } }

.photo-card {
  position:relative; border-radius:var(--r-lg); overflow:hidden;
  background:var(--surface);
  box-shadow:var(--shadow-card);
  border:1px solid rgba(34,211,238,.05);
  transition:transform .3s, box-shadow .3s, border-color .3s;
  cursor:pointer; width:100%;
}
.photo-card:hover { transform:scale(1.02); box-shadow:var(--shadow-glow); border-color:rgba(34,211,238,.3); }
.photo-card .ph-img { display:block; width:100%; height:auto; opacity:0; transition:opacity .3s; border-radius:var(--r-lg); }
.photo-card .ph-img.loaded { opacity:1; }
.photo-card .ratio-holder { position:relative; width:100%; }
.photo-card .ratio-holder .skeleton { position:absolute; inset:0; border-radius:var(--r-lg); }

/* 卡片角标 */
.card-badge {
  position:absolute; left:.5rem; bottom:.5rem; display:flex; align-items:center; gap:.25rem;
  padding:.2rem .5rem; border-radius:9999px; background:rgba(0,0,0,.5);
  backdrop-filter:blur(4px); color:rgba(255,255,255,.92); font-size:.7rem;
}
.card-badge .icon { color:var(--error); fill:var(--error); }

/* 多选勾选 */
.multi-check {
  position:absolute; top:.5rem; right:.5rem; width:1.5rem; height:1.5rem;
  border-radius:50%; border:2px solid rgba(255,255,255,.7);
  background:rgba(0,0,0,.3); backdrop-filter:blur(4px);
  display:none; align-items:center; justify-content:center;
  transition:all .2s; color:transparent; z-index:2;
}
.multi-check .icon { width:.9rem; height:.9rem; }
.photo-card.selected { box-shadow:0 0 0 2px var(--primary), 0 0 0 4px rgba(10,14,26,1), 0 0 20px rgba(34,211,238,.35); }
.photo-card.selected .multi-check { background:var(--primary); border-color:var(--primary); color:var(--on-primary); }

/* ============ 多选底部操作栏 ============ */
.multi-bar {
  position:fixed; bottom:0; left:0; right:0; z-index:40;
  background:rgba(15,21,36,.95); backdrop-filter:blur(20px) saturate(180%);
  border-top:1px solid rgba(30,38,64,.3);
  display:flex; align-items:center; justify-content:space-between;
  padding:.75rem 1rem; transform:translateY(110%); transition:transform .3s;
}
.multi-bar.show { transform:translateY(0); }
.multi-bar .count { font-size:.85rem; color:var(--on-variant); }
.multi-bar .actions { display:flex; gap:.5rem; }
.multi-bar .nav-btn.danger:hover { color:var(--error); background:rgba(244,63,94,.1); }

/* 框选矩形 */
.selection-box {
  position:fixed; z-index:30; pointer-events:none; display:none;
  border:1px dashed rgba(34,211,238,.5); background:rgba(34,211,238,.2);
}

/* ============ 上传浮层 ============ */
.overlay {
  position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.6);
  backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center;
}
.overlay.show { display:flex; }
.upload-box {
  background:var(--surface-high); border-radius:var(--r-xl); box-shadow:var(--shadow-dialog);
  padding:1.5rem; width:90%; max-width:24rem;
}
.upload-head { display:flex; align-items:center; gap:.75rem; margin-bottom:1rem; }
.upload-head .spin { width:2.5rem; height:2.5rem; border-radius:50%; background:rgba(34,211,238,.2); display:flex; align-items:center; justify-content:center; }
.upload-head .spin .icon { color:var(--primary); }
.upload-head h3 { font-size:.875rem; font-weight:600; }
.upload-head p { font-size:.75rem; color:var(--on-variant); margin-top:.15rem; word-break:break-all; }
.pbar { width:100%; height:.5rem; background:var(--surface); border-radius:9999px; overflow:hidden; }
.pbar-fill { height:100%; background:var(--primary); border-radius:9999px; width:0%; transition:width .3s; }
.upload-foot { display:flex; justify-content:space-between; align-items:center; margin-top:.5rem; }
.upload-pct { font-size:.75rem; color:var(--on-variant); }
.upload-info { font-size:.7rem; color:var(--on-variant); }

/* ============ Lightbox ============ */
.lightbox {
  position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.92);
  backdrop-filter:blur(8px); display:none; overflow:hidden; touch-action:none;
}
.lightbox.show { display:block; }
.lb-top {
  position:absolute; top:0; left:0; right:0; z-index:10;
  display:flex; align-items:center; justify-content:space-between;
  padding:1rem; background:linear-gradient(to bottom, rgba(0,0,0,.6), transparent);
}
.lb-counter { font-size:.875rem; font-weight:500; color:rgba(255,255,255,.8); }
.lb-top-actions { display:flex; gap:.25rem; }
.lb-btn {
  padding:.5rem; border-radius:9999px; color:rgba(255,255,255,.7);
  transition:all .2s; display:flex; align-items:center; justify-content:center;
}
.lb-btn:hover { color:#fff; background:rgba(255,255,255,.1); }
.lb-stage {
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  overflow:hidden;
}
.lb-img {
  max-width:90vw; max-height:85vh; border-radius:var(--r-lg);
  object-fit:contain; pointer-events:none;
  box-shadow:0 0 40px rgba(34,211,238,.2);
  will-change:transform;
}
.lb-prev,.lb-next {
  position:absolute; top:50%; transform:translateY(-50%); z-index:10;
  padding:.5rem .75rem; border-radius:9999px;
  background:rgba(255,255,255,.1); backdrop-filter:blur(4px);
  color:rgba(255,255,255,.8); transition:all .2s; display:flex;
}
.lb-prev { left:.75rem; } .lb-next { right:.75rem; }
@media(min-width:768px){ .lb-prev{ left:1.5rem; } .lb-next{ right:1.5rem; } .lb-prev,.lb-next{ padding:.75rem 1rem; } }
.lb-prev:hover,.lb-next:hover { background:rgba(255,255,255,.2); color:#fff; }

/* 手势提示图标 */
.gesture-icon {
  position:absolute; pointer-events:none; opacity:0;
  transition:opacity .15s, transform .15s;
  z-index:8; display:flex; align-items:center; justify-content:center;
}
.gi-circle {
  width:4rem; height:4rem; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  backdrop-filter:blur(4px); border-width:2px; border-style:solid;
}
.gi-circle .icon { width:2rem; height:2rem; }
.gi-left { left:1.5rem; top:50%; transform:translateY(-50%); border-color:var(--success); background:rgba(16,185,129,.15); }
.gi-left .gi-circle { border-color:rgba(16,185,129,.5); }
.gi-left .icon { color:var(--success); }
.gi-right { right:1.5rem; top:50%; transform:translateY(-50%); }
.gi-right .gi-circle { border-color:rgba(244,63,94,.5); background:rgba(244,63,94,.15); }
.gi-right .icon { color:var(--error); }
.gi-up { top:4rem; left:50%; transform:translateX(-50%); }
.gi-up .gi-circle { border-color:rgba(34,211,238,.5); background:rgba(34,211,238,.15); }
.gi-up .icon { color:var(--primary); }
.gi-down { bottom:4rem; left:50%; transform:translateX(-50%); }
.gi-down .gi-circle { border-color:rgba(34,211,238,.5); background:rgba(34,211,238,.15); }
.gi-down .icon { color:var(--primary); }

/* 底部圆点 */
.lb-dots {
  position:absolute; bottom:1.25rem; left:50%; transform:translateX(-50%);
  z-index:10; display:flex; gap:.35rem; max-width:80vw; overflow:hidden;
}
.lb-dots .dot { width:.4rem; height:.4rem; border-radius:9999px; background:rgba(255,255,255,.3); transition:all .25s; flex-shrink:0; }
.lb-dots .dot.active { background:#fff; }

/* ============ 更多菜单 ============ */
.mask { position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.5); display:none; }
.mask.show { display:block; }
.menu {
  position:fixed; bottom:0; left:0; right:0; z-index:85;
  background:var(--surface-high); border-radius:1.5rem 1.5rem 0 0;
  box-shadow:var(--shadow-dialog);
  transform:translateY(110%); transition:transform .3s cubic-bezier(.16,1,.3,1);
  padding-bottom:env(safe-area-inset-bottom);
}
.menu.show { transform:translateY(0); }
.menu .grab { width:2.5rem; height:.25rem; background:var(--outline-variant); border-radius:9999px; margin:.75rem auto .5rem; }
.menu-item {
  width:100%; display:flex; align-items:center; gap:.75rem;
  padding:.9rem 1rem; border-radius:var(--r-xl); text-align:left;
  color:var(--on-surface); font-size:.875rem; transition:background .2s;
}
.menu-item:hover { background:var(--surface-container); }
.menu-item .icon { color:var(--on-variant); }
.menu-item .ext { margin-left:auto; color:rgba(123,133,160,.6); }
.menu-divider { height:1px; background:rgba(30,38,64,.3); margin:.4rem .5rem; }
.menu-cancel { color:var(--on-variant); font-weight:500; justify-content:center; }

/* ============ Toast ============ */
.toasts {
  position:fixed; bottom:5rem; right:.75rem; z-index:100;
  display:flex; flex-direction:column; gap:.5rem; pointer-events:none;
}
@media(min-width:768px){ .toasts{ bottom:2rem; right:1.5rem; } }
.toast {
  display:flex; align-items:center; gap:.6rem;
  background:var(--surface-highest); color:var(--on-surface);
  border-radius:var(--r-lg); box-shadow:var(--shadow-dialog);
  border:1px solid rgba(30,38,64,.2);
  padding:.75rem 1rem; font-size:.85rem; max-width:18rem;
  animation:toastIn .3s ease forwards;
}
.toast .icon { color:var(--primary); }
.toast.out { animation:toastOut .3s ease forwards; }
@keyframes toastIn { from{transform:translateY(20px); opacity:0} to{transform:translateY(0); opacity:1} }
@keyframes toastOut { from{transform:translateY(0); opacity:1} to{transform:translateY(20px); opacity:0} }

/* 隐藏元素 */
.hidden { display:none !important; }
</style>
</head>
<body>

<!-- ============ 顶部导航 ============ -->
<header>
  <div class="sort-group" id="sortGroup">
    <button class="sort-btn active" id="sortLatest">
      <svg class="icon" data-i="clock-desc"></svg>
      <span id="latestText">最新</span>
    </button>
    <button class="sort-btn" id="sortHotest">
      <svg class="icon" data-i="flame"></svg>
      <span id="hotestText">最热</span>
    </button>
  </div>

  <div class="header-title">
    <svg class="icon" data-i="aperture"></svg>
    <h1 id="headerTitle">Infoto</h1>
  </div>

  <div class="nav-actions">
    <button class="nav-btn" id="multiSelectBtn" title="多选">
      <svg class="icon-lg" data-i="check-square"></svg>
    </button>
    <button class="nav-btn upload" id="uploadBtn" title="上传">
      <svg class="icon-lg" data-i="upload-cloud"></svg>
    </button>
    <input type="file" id="fileInput" class="hidden" multiple accept="image/*" />
  </div>
</header>

<!-- ============ 主内容 ============ -->
<main>
  <!-- 空态 -->
  <div class="empty hidden" id="emptyState">
    <div class="circle"><svg class="icon" data-i="upload-cloud"></svg></div>
    <p>还没有照片，点击右上角上传第一张吧</p>
  </div>

  <!-- 瀑布流容器 -->
  <div class="masonry hidden" id="masonry"></div>
</main>

<!-- ============ 多选底部操作栏 ============ -->
<div class="multi-bar" id="multiBar">
  <span class="count" id="selectedCount">已选择 0 张</span>
  <div class="actions">
    <button class="nav-btn" id="batchDownloadBtn" title="批量下载">
      <svg class="icon-lg" data-i="download"></svg>
    </button>
    <button class="nav-btn danger" id="batchDeleteBtn" title="批量删除">
      <svg class="icon-lg" data-i="trash"></svg>
    </button>
  </div>
</div>

<!-- 框选矩形 -->
<div class="selection-box" id="selectionBox"></div>

<!-- ============ 上传浮层 ============ -->
<div class="overlay" id="uploadOverlay">
  <div class="upload-box">
    <div class="upload-head">
      <div class="spin"><svg class="icon" data-i="upload-cloud"></svg></div>
      <div>
        <h3>正在上传图片</h3>
        <p id="uploadFileName">IMG_001.jpg</p>
      </div>
    </div>
    <div class="pbar"><div class="pbar-fill" id="uploadProgressBar"></div></div>
    <div class="upload-foot">
      <span class="upload-info" id="uploadStep">直链上传</span>
      <span class="upload-pct" id="uploadProgressText">0%</span>
    </div>
  </div>
</div>

<!-- ============ Lightbox ============ -->
<div class="lightbox" id="lightbox">
  <div class="lb-top">
    <span class="lb-counter" id="lbCounter">1 / 1</span>
    <div class="lb-top-actions">
      <button class="lb-btn" id="lbMoreBtn" title="更多">
        <svg class="icon-lg" data-i="more"></svg>
      </button>
      <button class="lb-btn" id="lbCloseBtn" title="关闭">
        <svg class="icon-lg" data-i="x"></svg>
      </button>
    </div>
  </div>

  <button class="lb-prev" id="lbPrev"><svg class="icon-lg" data-i="chevron-left"></svg></button>
  <button class="lb-next" id="lbNext"><svg class="icon-lg" data-i="chevron-right"></svg></button>

  <div class="lb-stage" id="lbStage">
    <img class="lb-img" id="lbImg" alt="预览图片" draggable="false" />
  </div>

  <!-- 四向手势图标：左=支持(绿心) 右=反对(红叉) 上=菜单 下=下载 -->
  <div class="gesture-icon gi-left" id="giLeft">
    <div class="gi-circle"><svg class="icon" data-i="heart"></svg></div>
  </div>
  <div class="gesture-icon gi-right" id="giRight">
    <div class="gi-circle"><svg class="icon" data-i="x-circle"></svg></div>
  </div>
  <div class="gesture-icon gi-up" id="giUp">
    <div class="gi-circle"><svg class="icon" data-i="more"></svg></div>
  </div>
  <div class="gesture-icon gi-down" id="giDown">
    <div class="gi-circle"><svg class="icon" data-i="download"></svg></div>
  </div>

  <div class="lb-dots" id="lbDots"></div>
</div>

<!-- ============ 更多菜单 ============ -->
<div class="mask" id="menuMask"></div>
<div class="menu" id="menu">
  <div class="grab"></div>
  <button class="menu-item" id="menuCopyImage">
    <svg class="icon" data-i="copy"></svg><span>复制原图</span>
  </button>
  <button class="menu-item" id="menuCopyLink">
    <svg class="icon" data-i="link"></svg><span>复制直链</span>
  </button>
  <button class="menu-item" id="menuShare">
    <svg class="icon" data-i="share"></svg><span>转发分享</span>
  </button>
  <button class="menu-item" id="menuGoogle">
    <svg class="icon" data-i="search"></svg><span>使用谷歌搜图</span>
    <svg class="icon ext" data-i="external"></svg>
  </button>
  <div class="menu-divider"></div>
  <button class="menu-item menu-cancel" id="menuCancel"><span>取消</span></button>
</div>

<!-- Toast -->
<div class="toasts" id="toasts"></div>

<script>
/* =========================================================
   图标库（内联 SVG，lucide 风格路径，无外部依赖）
   ========================================================= */
const ICONS = {
  'aperture':'<circle cx="12" cy="12" r="10"/><line x1="14.31" y1="8" x2="20.05" y2="17.94"/><line x1="9.69" y1="8" x2="21.17" y2="8"/><line x1="7.38" y1="12" x2="13.12" y2="2.06"/><line x1="9.69" y1="16" x2="3.95" y2="6.06"/><line x1="14.31" y1="16" x2="2.83" y2="16"/><line x1="16.62" y1="12" x2="10.88" y2="21.94"/>',

<script>
/* =========================================================
   配置：图床上传协议参数（逆向自 tc.0147258.xyz 前端）
   ========================================================= */
const CONFIG = {
  JWT_SECRET: '9a31f2e82617e4b4b482110f8c928b9b2734d809f060c30f12e8b2574a84c122',
  UPLOAD_PATH: '/upload',
  SIZE_MB_THRESHOLD: 50,
  CDEAA_MIMES: ['application/javascript','text/javascript','text/css','font/ttf'],
  // 图床源站（直传目标）：跨域直传被 CORS 拦截时走同源 Worker 代理
  BED_ORIGIN: 'https://tc.0147258.xyz',
  // 共享后端：默认空 = 同源（Cloudflare Worker 部署形态，/api/* 由 Worker 处理）
  // 若要独立后端，改为完整地址，如 'http://localhost:8080'
  API_BASE: '',
};

/* ---- base64url ---- */
function b64u(bytes){
  let bin=''; for(let i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function sha256Hex(buf){
  const d = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(d)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function hmacSign(secret, data){
  const key = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret),
    {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', key, new TextEncoder().encode(data));
  return b64u(new Uint8Array(sig));
}
async function makeJwt(sha){
  const header = b64u(new TextEncoder().encode(JSON.stringify({alg:'HS256',typ:'JWT'})));
  const claims = {timestamp: Date.now()};
  if(sha) claims.sha256 = sha;
  const payload = b64u(new TextEncoder().encode(JSON.stringify(claims)));
  const sig = await hmacSign(CONFIG.JWT_SECRET, header+'.'+payload);
  return `${header}.${payload}.${sig}`;
}

/* ---- 图床上传（XHR 带进度） ----
   小文件: POST <origin>/upload, X-Auth-Token: JWT, FormData{file}
   返回: {"data": "直链"}
   fallback: POST cdeaa.qdqqd.com/.../put-file-attach, FormData{file}, 返回 data.link
*/
function uploadViaXhr(url, fd, headers, onProgress){
  return new Promise((resolve,reject)=>{
    const xhr = new XMLHttpRequest();
    xhr.open('POST', url, true);
    for(const k in headers) xhr.setRequestHeader(k, headers[k]);
    xhr.upload.onprogress = e => { if(e.lengthComputable) onProgress(e.loaded/e.total); };
    xhr.onload = () => { xhr.status===200 ? resolve(xhr.responseText) : reject(new Error('HTTP '+xhr.status)); };
    xhr.onerror = () => reject(new Error('网络错误'));
    xhr.send(fd);
  });
}

async function uploadToBed(file, onProgress){
  onProgress(0.05);

  // 小文件主路径
  if(!CONFIG.CDEAA_MIMES.includes(file.type) && file.size <= CONFIG.SIZE_MB_THRESHOLD*1024*1024){
    const sha = await sha256Hex(await file.arrayBuffer());
    const token = await makeJwt(sha);
    const fd = new FormData();
    fd.append('file', file);
    try {
      // 优先浏览器直传（图床 CORS 放行时）
      const txt = await uploadViaXhr(CONFIG.BED_ORIGIN + CONFIG.UPLOAD_PATH, fd, {'X-Auth-Token': token}, p=>onProgress(0.05 + p*0.9));
      onProgress(0.95);
      const json = JSON.parse(txt);
      if(!json.data) throw new Error('上传响应缺少 data');
      onProgress(1);
      return json.data;
    } catch(e1) {
      // 跨域直传被拦 → 走同源 Worker 透明代理（/api/upload-proxy）
      const txt = await uploadViaXhr(apiBase() + '/api/upload-proxy', fd, {'X-Auth-Token': token}, p=>onProgress(0.05 + p*0.9));
      onProgress(0.95);
      const json = JSON.parse(txt);
      if(!json.data) throw new Error('上传响应缺少 data');
      onProgress(1);
      return json.data;
    }
  }
  // 大文件 fallback（cdeaa OSS 公共直链，尽量不用）
  const fd = new FormData();
  fd.append('file', file);
  try {
    const txt = await uploadViaXhr('https://cdeaa.qdqqd.com/public/resource/oss/put-file-attach', fd, {}, p=>onProgress(p));
    const json = JSON.parse(txt);
    if(!(json.data && json.data.link)) throw new Error('上传响应缺少 link');
    onProgress(1);
    return 'https://www.lnjubao.cn' + json.data.link;
  } catch(e2) {
    const txt = await uploadViaXhr(apiBase() + '/api/upload-proxy', fd, {}, p=>onProgress(p));
    const json = JSON.parse(txt);
    if(!(json.data && json.data.link)) throw new Error('上传响应缺少 link');
    onProgress(1);
    return 'https://www.lnjubao.cn' + json.data.link;
  }
}
/* 返回 API 根：同源(空字符串) 或自定义 API_BASE */
function apiBase(){ return CONFIG.API_BASE || ''; }

/* =========================================================
   数据层：Cloudflare Worker 同源 API 优先，localStorage 兜底
   ========================================================= */
const Store = {
  photos: [],
  _loaded: false,

  async load(){
    if(this._loaded) return this.photos;
    this._loaded = true;
    try{
      const r = await fetch(apiBase() + '/api/photos', {cache:'no-store'});
      if(r.ok){ this.photos = await r.json(); this._remote = true; return this.photos; }
    }catch(e){ console.warn('[infoto] 后端不可用，回退 localStorage', e); }
    try{ this.photos = JSON.parse(localStorage.getItem('infoto_photos')||'[]'); }catch(e){ this.photos=[]; }
    this._remote = false;
    return this.photos;
  },

  async save(){
    if(this._remote){
      try{
        await fetch(apiBase() + '/api/photos', {
          method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(this.photos)
        });
        return;
      }catch(e){ console.warn('[infoto] 后端保存失败，回退 localStorage', e); this._remote = false; }
    }
    localStorage.setItem('infoto_photos', JSON.stringify(this.photos));
  },

  async add(photo){
    photo.id = photo.id || 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
    this.photos.unshift(photo);
    await this.save();
    return photo;
  },
  async remove(ids){
    const set = new Set(ids);
    this.photos = this.photos.filter(p=>!set.has(p.id));
    await this.save();
  },
  async setLike(id, delta){
    const p = this.photos.find(x=>x.id===id);
    if(!p) return;
    if(delta>0) p.likes = (p.likes||0) + delta;
    else p.dislikes = (p.dislikes||0) - delta;
    await this.save();
  }
};

/* =========================================================
   UI 状态
   ========================================================= */
const state = {
  sortBy:'latest', latestDir:'desc', hotestDir:'desc',
  multiMode:false, selected:new Set(),
  longPressTimer:null, longPressTriggered:false,
  lightboxOpen:false, currentIndex:0,
  boxSelecting:false, boxStart:null,
  menuOpen:false,
  dragging:false, dragStart:null, dragCurrent:null,
  skeleton:true
};

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const el = (tag, cls, html) => { const d=document.createElement(tag); if(cls)d.className=cls; if(html!=null)d.innerHTML=html; return d; };

/* ---- Toast ---- */
function toast(msg, icon='info'){
  const t = el('div','toast',`<svg class="icon" data-i="${icon}"></svg><span></span>`);
  renderIcons(t);
  t.querySelector('span').textContent = msg;
  $('#toasts').appendChild(t);
  setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(), 320); }, 2600);
}

/* ---- 排序 ---- */
function getSorted(){
  const arr = [...Store.photos];
  if(state.sortBy==='latest'){
    arr.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
    if(state.latestDir==='desc') arr.reverse();
  }else{
    arr.sort((a,b)=>(a.likes||0)-(b.likes||0));
    if(state.hotestDir==='desc') arr.reverse();
  }
  return arr;
}
function updateSortUI(){
  const latestActive = state.sortBy==='latest';
  $('#sortLatest').classList.toggle('active', latestActive);
  $('#sortHotest').classList.toggle('active', !latestActive);
  $('#latestText').textContent = latestActive ? (state.latestDir==='desc'?'最新':'最旧') : '最新';
  $('#hotestText').textContent = !latestActive ? (state.hotestDir==='desc'?'最热':'最冷') : '最热';
  const ic = latestActive ? (state.latestDir==='desc'?'clock-desc':'clock-asc') : 'flame';
  $('#sortLatest').querySelector('.icon').setAttribute('data-i', ic);
  renderIcons();
}
$('#sortLatest').addEventListener('click', ()=>{
  if(state.sortBy==='latest') state.latestDir = state.latestDir==='desc'?'asc':'desc';
  else state.sortBy='latest';
  updateSortUI(); renderMasonry();
});
$('#sortHotest').addEventListener('click', ()=>{
  if(state.sortBy==='hotest') state.hotestDir = state.hotestDir==='desc'?'asc':'desc';
  else state.sortBy='hotest';
  updateSortUI(); renderMasonry();
});

/* =========================================================
   瀑布流（列容器法：动态列数 + 最短列优先）
   ========================================================= */
function colCount(){
  const w = window.innerWidth;
  if(w>=1536) return 6; if(w>=1280) return 5; if(w>=1024) return 4; if(w>=768) return 3; return 2;
}
let cols = [];

function buildColumns(){
  const m = $('#masonry');
  m.innerHTML = '';
  cols = [];
  for(let i=0;i<colCount();i++){
    const c = el('div','masonry-col');
    m.appendChild(c); cols.push(c);
  }
}

/* 为卡片建立比例占位（图片加载前防布局抖动） */
function makeCard(photo, index){
  const card = el('div','photo-card');
  card.dataset.id = photo.id;

  const holder = el('div','ratio-holder');
  if(photo.width && photo.height){
    holder.style.paddingBottom = (photo.height/photo.width*100) + '%';
  }else{
    holder.style.paddingBottom = '100%';
  }
  const skel = el('div','skeleton');
  const img = el('img','ph-img');
  img.loading = 'lazy';
  img.alt = photo.filename || 'photo';
  img.src = photo.url;
  img.onload = ()=>{
    if(!photo.width){
      photo.width = img.naturalWidth; photo.height = img.naturalHeight;
      holder.style.paddingBottom = (photo.height/photo.width*100) + '%';
      Store.save();
    }
    img.classList.add('loaded');
    skel.remove();
  };
  img.onerror = ()=>{ skel.remove(); img.classList.add('loaded'); img.style.opacity = '.4'; };

  holder.appendChild(skel);
  holder.appendChild(img);
  card.appendChild(holder);

  // 喜欢数角标
  if((photo.likes||0)>0){
    const badge = el('div','card-badge',`<svg class="icon" data-i="heart"></svg><span>${photo.likes}</span>`);
    renderIcons(badge);
    card.appendChild(badge);
  }
  // 多选勾选
  const check = el('div','multi-check',`<svg class="icon" data-i="check"></svg>`);
  renderIcons(check);
  card.appendChild(check);
  return card;
}

function applySelectUI(){
  $$('.photo-card').forEach(c=>{
    const sel = state.selected.has(c.dataset.id);
    c.classList.toggle('selected', sel);
    c.querySelector('.multi-check').style.display = state.multiMode ? 'flex' : 'none';
  });
}

function renderMasonry(){
  const list = getSorted();
  const m = $('#masonry');
  if(list.length===0){
    m.classList.add('hidden');
    $('#emptyState').classList.remove('hidden');
    return;
  }
  $('#emptyState').classList.add('hidden');
  m.classList.remove('hidden');
  buildColumns();

  /* 最短列优先（列容器法核心） */
  const heights = new Array(cols.length).fill(0);
  list.forEach((photo, i)=>{
    const card = makeCard(photo, i);
    let minCol = 0;
    for(let j=1;j<cols.length;j++) if(heights[j] < heights[minCol]) minCol = j;
    cols[minCol].appendChild(card);
    // 估算高度（用已知比例或图片自然尺寸；未知时先按1:1）
    const ratio = (photo.height&&photo.width) ? photo.height/photo.width : 1;
    heights[minCol] += ratio * 100 + 12; // 每项加 gap 近似
  });

  if(state.multiMode) applySelectUI();
}

/* 列数变化时重建 */
let resizeTimer;
window.addEventListener('resize', ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(()=>{
    if(colCount() !== cols.length && !state.lightboxOpen) renderMasonry();
  }, 200);
});

/* =========================================================
   多选模式
   ========================================================= */
function enterMulti(initialId){
  state.multiMode = true;
  state.selected.clear();
  if(initialId) state.selected.add(initialId);
  $('#multiSelectBtn').querySelector('svg').setAttribute('data-i','x');
  $('#uploadBtn').classList.add('hidden');
  $('#multiBar').classList.add('show');
  $('#headerTitle').textContent = '选择照片';
  renderIcons();
  applySelectUI();
  updateCount();
}
function exitMulti(){
  state.multiMode = false;
  state.selected.clear();
  $('#multiSelectBtn').querySelector('svg').setAttribute('data-i','check-square');
  $('#uploadBtn').classList.remove('hidden');
  $('#multiBar').classList.remove('show');
  $('#headerTitle').textContent = 'Infoto';
  $('#selectionBox').style.display='none';
  renderIcons();
  applySelectUI();
}
function toggleSelect(id){
  if(state.selected.has(id)) state.selected.delete(id);
  else state.selected.add(id);
  applySelectUI(); updateCount();
}
function updateCount(){
  const n = state.selected.size;
  $('#selectedCount').textContent = `已选择 ${n} 张`;
  $('#headerTitle').textContent = n>0 ? `已选择 ${n} 张` : '选择照片';
}
$('#multiSelectBtn').addEventListener('click', ()=>{
  state.multiMode ? exitMulti() : enterMulti();
});

/* 长按进入多选 + 点击行为 */
$('#masonry').addEventListener('mousedown', onCardPress);
$('#masonry').addEventListener('touchstart', onCardPress, {passive:true});
function onCardPress(e){
  const card = e.target.closest('.photo-card');
  if(!card) return;
  if(e.type==='mousedown' && e.button!==0) return;
  state.longPressTriggered = false;
  clearTimeout(state.longPressTimer);
  state.longPressTimer = setTimeout(()=>{
    state.longPressTriggered = true;
    if(!state.multiMode) enterMulti(card.dataset.id);
    else toggleSelect(card.dataset.id);
  }, 500);
}
['mouseup','mouseleave','touchend','touchmove','touchcancel','click'].forEach(ev=>{
  $('#masonry').addEventListener(ev, ()=>{
    clearTimeout(state.longPressTimer);
  });
});
$('#masonry').addEventListener('click', (e)=>{
  const card = e.target.closest('.photo-card');
  if(!card) return;
  if(state.longPressTriggered) return;
  const id = card.dataset.id;
  if(state.multiMode){ toggleSelect(id); return; }
  openLightbox(getSorted().findIndex(p=>p.id===id));
});

/* ---- 拖动框选（桌面端多选模式） ---- */
document.addEventListener('mousedown', e=>{
  if(!state.multiMode) return;
  if(!e.target.closest('#masonry')) return;
  if(e.target.closest('.photo-card')) return;
  state.boxSelecting = true;
  state.boxStart = {x:e.clientX, y:e.clientY};
  const b = $('#selectionBox');
  b.style.display='block';
  b.style.left=e.clientX+'px'; b.style.top=e.clientY+'px';
  b.style.width='0'; b.style.height='0';
  e.preventDefault();
});
document.addEventListener('mousemove', e=>{
  if(!state.boxSelecting) return;
  const s = state.boxStart;
  const x=Math.min(s.x,e.clientX), y=Math.min(s.y,e.clientY);
  const w=Math.abs(e.clientX-s.x), h=Math.abs(e.clientY-s.y);
  const b = $('#selectionBox');
  b.style.left=x+'px'; b.style.top=y+'px'; b.style.width=w+'px'; b.style.height=h+'px';
  const box = {left:x, right:x+w, top:y, bottom:y+h};
  $$('.photo-card').forEach(c=>{
    const r = c.getBoundingClientRect();
    const hit = !(r.right<box.left || r.left>box.right || r.bottom<box.top || r.top>box.bottom);
    if(hit) state.selected.add(c.dataset.id);
  });
  applySelectUI(); updateCount();
});
document.addEventListener('mouseup', ()=>{
  if(state.boxSelecting){
    state.boxSelecting=false;
    $('#selectionBox').style.display='none';
  }
});

/* ---- 批量操作 ---- */
$('#batchDownloadBtn').addEventListener('click', async ()=>{
  const list = getSorted().filter(p=>state.selected.has(p.id));
  if(list.length===0){ toast('请先选择照片'); return; }
  toast(`开始下载 ${list.length} 张图片`, 'download');
  list.forEach(p=>downloadUrl(p.url, p.filename||'image.jpg'));
});
$('#batchDeleteBtn').addEventListener('click', async ()=>{
  const n = state.selected.size;
  if(n===0){ toast('请先选择照片'); return; }
  if(!confirm(`确定删除已选择的 ${n} 张照片吗？`)) return;
  await Store.remove([...state.selected]);
  exitMulti();
  renderMasonry();
  toast(`已删除 ${n} 张照片`, 'success');
});

/* =========================================================
   上传（浏览器直传图床 → 直链存数据层）
   ========================================================= */
$('#uploadBtn').addEventListener('click', ()=>$('#fileInput').click());
$('#fileInput').addEventListener('change', async e=>{
  const files = [...(e.target.files||[])];
  e.target.value='';
  if(files.length===0) return;
  await uploadFiles(files);
});

async function uploadFiles(files){
  const overlay = $('#uploadOverlay');
  overlay.classList.add('show');
  const bar = $('#uploadProgressBar');
  const pct = $('#uploadProgressText');
  const fname = $('#uploadFileName');
  const step = $('#uploadStep');

  let done=0, failed=0;
  for(const file of files){
    fname.textContent = file.name;
    step.textContent = '计算哈希…';
    bar.style.width='0%'; pct.textContent='0%';
    try{
      const url = await uploadToBed(file, p=>{
        bar.style.width = Math.round(p*100)+'%';
        pct.textContent = Math.round(p*100)+'%';
        step.textContent = p<1 ? '直链上传' : '获取直链';
      });
      step.textContent = '获取尺寸…';
      const photo = {id:null, url, width:0, height:0, createdAt:Date.now(), likes:0, dislikes:0, filename:file.name};
      await loadDims(photo);
      await Store.add(photo);
      done++;
    }catch(err){
      console.error('upload failed:', file.name, err);
      failed++;
      toast(`「${file.name}」上传失败: ${err.message}`, 'alert');
    }
  }
  overlay.classList.remove('show');
  renderMasonry();
  if(done>0) toast(`上传成功 ${done} 张`, 'success');
}

/* 跨域取图片尺寸 */
function loadDims(photo){
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{ photo.width=img.naturalWidth||0; photo.height=img.naturalHeight||0; resolve(); };
    img.onerror = ()=>{ photo.width=photo.width||0; photo.height=photo.height||0; resolve(); };
    img.src = photo.url;
    setTimeout(resolve, 8000); // 兜底超时
  });
}

/* =========================================================
   Lightbox 卡片预览 + 四向手势
   ========================================================= */
const THRESHOLD = 80;

function openLightbox(idx){
  const list = getSorted();
  if(idx<0 || idx>=list.length) return;
  state.currentIndex = idx;
  state.lightboxOpen = true;
  $('#lightbox').classList.add('show');
  document.body.style.overflow='hidden';
  updateLightbox();
  renderDots();
}
function closeLightbox(){
  state.lightboxOpen=false;
  $('#lightbox').classList.remove('show');
  document.body.style.overflow='';
  closeMenu();
  resetGestures();
}
function curPhoto(){ return getSorted()[state.currentIndex]; }
function updateLightbox(){
  const p = curPhoto();
  if(!p) return;
  const img = $('#lbImg');
  img.style.transition='none';
  img.style.transform='translate(0,0) scale(1)';
  img.style.opacity=1;
  img.src = p.url;
  img.alt = p.filename||'photo';
  $('#lbCounter').textContent = `${state.currentIndex+1} / ${getSorted().length}`;
  renderDots();
}
function renderDots(){
  const d = $('#lbDots');
  d.innerHTML='';
  const list = getSorted();
  const max = Math.min(list.length, 20);
  for(let i=0;i<max;i++){
    const dot = el('span','dot'+(i===state.currentIndex?' active':''));
    d.appendChild(dot);
  }
}
function prevPhoto(){ state.currentIndex=(state.currentIndex-1+getSorted().length)%getSorted().length; updateLightbox(); }
function nextPhoto(){ state.currentIndex=(state.currentIndex+1)%getSorted().length; updateLightbox(); }

$('#lbCloseBtn').addEventListener('click', closeLightbox);
$('#lbPrev').addEventListener('click', e=>{ e.stopPropagation(); prevPhoto(); });
$('#lbNext').addEventListener('click', e=>{ e.stopPropagation(); nextPhoto(); });
$('#lightbox').addEventListener('click', e=>{ if(e.target.id==='lightbox') closeLightbox(); });

document.addEventListener('keydown', e=>{
  if(!state.lightboxOpen) return;
  if(e.key==='ArrowLeft') prevPhoto();
  else if(e.key==='ArrowRight') nextPhoto();
  else if(e.key==='Escape') closeLightbox();
});

/* 手势 */
function resetGestures(){
  ['#giLeft','#giRight','#giUp','#giDown'].forEach(s=>{
    const g = $(s);
    g.style.opacity=0; g.style.transform='';
  });
}
function onGs(e){
  if(!state.lightboxOpen || state.menuOpen) return;
  if(e.target.closest('#lbMoreBtn,#lbCloseBtn,#lbPrev,#lbNext')) return;
  state.dragging = true;
  const pt = e.touches ? e.touches[0] : e;
  state.dragStart = {x:pt.clientX, y:pt.clientY};
  state.dragCurrent = {x:pt.clientX, y:pt.clientY};
  $('#lbImg').style.transition='none';
  resetGestures();
}
function onGm(e){
  if(!state.dragging) return;
  const pt = e.touches ? e.touches[0] : e;
  const dx = pt.clientX - state.dragStart.x;
  const dy = pt.clientY - state.dragStart.y;
  state.dragCurrent = {x:pt.clientX, y:pt.clientY};
  const img = $('#lbImg');
  img.style.transform = `translate(${dx}px, ${dy}px) scale(1)`;

  const ax=Math.abs(dx), ay=Math.abs(dy);
  let dir=null, dist=0;
  if(ax>ay){ dir = dx>0?'right':'left'; dist=ax; } else { dir = dy>0?'down':'up'; dist=ay; }
  const ratio = Math.min(dist/THRESHOLD, 1);
  resetGestures();
  if(dist>10){
    const g = $( dir==='left'?'#giLeft': dir==='right'?'#giRight': dir==='down'?'#giDown':'#giUp' );
    if(g){
      g.style.opacity = ratio;
      const base = dir==='left'||dir==='right' ? 'translateY(-50%)' : 'translateX(-50%)';
      g.style.transform = base + ` scale(${0.8+ratio*0.4})`;
    }
  }
  if(e.cancelable) e.preventDefault();
}
function onGe(){
  if(!state.dragging) return;
  state.dragging = false;
  const dx = state.dragCurrent.x - state.dragStart.x;
  const dy = state.dragCurrent.y - state.dragStart.y;
  const ax=Math.abs(dx), ay=Math.abs(dy);
  const img = $('#lbImg');
  img.style.transition='transform .3s ease, opacity .3s ease';
  const p = curPhoto();

  if(ax>ay){
    if(ax>THRESHOLD){
      if(dx<0){ // 左滑 → 支持(喜欢)
        toast('已标记为喜欢','heart');
        Store.setLike(p.id, +1);
        const gi=$('#giLeft'); gi.style.opacity=1; gi.style.transform='translateY(-50%) scale(1.2)';
        setTimeout(()=>{ resetGestures(); nextPhoto(); }, 250);
      }else{ // 右滑 → 反对(不喜欢)
        toast('已标记为不喜欢','alert');
        Store.setLike(p.id, -1);
        const gi=$('#giRight'); gi.style.opacity=1; gi.style.transform='translateY(-50%) scale(1.2)';
        setTimeout(()=>{ resetGestures(); nextPhoto(); }, 250);
      }
      return;
    }
  }else{
    if(ay>THRESHOLD){
      if(dy>0){ // 下滑 → 下载
        const gi=$('#giDown'); gi.style.opacity=1; gi.style.transform='translateX(-50%) scale(1.2)';
        downloadUrl(p.url, p.filename||'image.jpg');
        toast('开始下载','download');
        setTimeout(()=>{ resetGestures(); }, 300);
      }else{ // 上滑 → 更多菜单
        const gi=$('#giUp'); gi.style.opacity=1; gi.style.transform='translateX(-50%) scale(1.2)';
        setTimeout(()=>{ resetGestures(); openMenu(); }, 250);
      }
      return;
    }
  }
  img.style.transform='translate(0,0)';
  resetGestures();
}

const stage = $('#lbStage');
stage.addEventListener('mousedown', onGs);
document.addEventListener('mousemove', onGm);
document.addEventListener('mouseup', ()=>{ if(state.dragging) onGe(); });
stage.addEventListener('touchstart', onGs, {passive:false});
stage.addEventListener('touchmove', onGm, {passive:false});
stage.addEventListener('touchend', onGe);

/* =========================================================
   更多菜单
   ========================================================= */
function openMenu(){ state.menuOpen=true; $('#menuMask').classList.add('show'); $('#menu').classList.add('show'); }
function closeMenu(){ state.menuOpen=false; $('#menuMask').classList.remove('show'); $('#menu').classList.remove('show'); }
$('#lbMoreBtn').addEventListener('click', e=>{ e.stopPropagation(); openMenu(); });
$('#menuMask').addEventListener('click', closeMenu);
$('#menuCancel').addEventListener('click', closeMenu);

async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); return true; }
  catch(e){
    try{
      const ta = el('textarea');
      ta.value=txt; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove(); return true;
    }catch(e2){ return false; }
  }
}
$('#menuCopyLink').addEventListener('click', async ()=>{
  const ok = await copyText(curPhoto().url);
  toast(ok?'已复制直链到剪贴板':'复制失败','success');
  closeMenu();
});
$('#menuCopyImage').addEventListener('click', async ()=>{
  try{
    const blob = await (await fetch(curPhoto().url)).blob();
    await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
    toast('已复制图片到剪贴板','success');
  }catch(e){
    toast('复制图片失败（浏览器限制），已复制直链','alert');
    copyText(curPhoto().url);
  }
  closeMenu();
});
$('#menuShare').addEventListener('click', async ()=>{
  const p = curPhoto();
  if(navigator.share){
    try{ await navigator.share({title:p.filename||'Infoto 照片', url:p.url}); }catch(e){}
  }else{
    await copyText(p.url);
    toast('已复制链接，去分享吧','success');
  }
  closeMenu();
});
$('#menuGoogle').addEventListener('click', ()=>{
  window.open('https://www.google.com/searchbyimage?image_url=' + encodeURIComponent(curPhoto().url), '_blank');
  toast('即将打开 Google 搜图','info');
  closeMenu();
});

/* 下载（跨域用 a[download]，失败则新标签） */
function downloadUrl(url, name){
  const a = el('a');
  a.href=url; a.download=name||'image.jpg';
  a.target='_blank'; a.rel='noopener';
  document.body.appendChild(a); a.click(); a.remove();
}

/* =========================================================
   初始化
   ========================================================= */
(async function init(){
  // URL 参数 ?api=<base> 覆盖共享后端（便于免改文件部署），例如 ?api=http://192.168.1.5:8080
  try{
    const q = new URLSearchParams(location.search).get('api');
    if(q) CONFIG.API_BASE = q;
  }catch(e){}
  renderIcons();
  updateSortUI();
  await Store.load();
  renderMasonry();
})();
</script>
