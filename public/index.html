<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0e1a" />
  <title>Infoto</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%2322d3ee%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22/><line x1=%2214.31%22 y1=%228%22 x2=%2220.05%22 y2=%2217.94%22/><line x1=%229.69%22 y1=%228%22 x2=%2221.17%22 y2=%228%22/><line x1=%227.38%22 y1=%2212%22 x2=%2213.12%22 y2=%222.06%22/><line x1=%229.69%22 y1=%2216%22 x2=%223.95%22 y2=%226.06%22/><line x1=%2214.31%22 y1=%2216%22 x2=%222.83%22 y2=%2216%22/><line x1=%2216.62%22 y1=%2212%22 x2=%2210.88%22 y2=%2221.94%22/></svg>" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- ============ 顶部导航 ============ -->
  <header>
    <div class="sort-group" id="sortGroup">
      <button class="sort-btn active" id="sortLatest">
        <svg class="icon" data-i="clock-desc"></svg>
        <span id="latestText">最新</span>
      </button>
      <button class="sort-btn" id="sortHotest">
        <svg class="icon" data-i="flame"></svg>
        <span id="hotestText">最热</span>
      </button>
    </div>

    <div class="nav-actions">
      <button class="nav-btn" id="multiSelectBtn" title="多选">
        <svg class="icon-lg" data-i="check-square"></svg>
      </button>
      <button class="nav-btn upload" id="uploadBtn" title="上传">
        <svg class="icon-lg" data-i="upload-cloud"></svg>
      </button>
      <input type="file" id="fileInput" class="hidden" multiple />
    </div>
  </header>

  <!-- ============ 主内容 ============ -->
  <main>
    <div class="empty hidden" id="emptyState">
      <div class="circle"><svg class="icon" data-i="upload-cloud"></svg></div>
      <p>还没有照片，点击右上角上传第一张吧</p>
    </div>

    <div class="masonry hidden" id="masonry"></div>
  </main>

  <!-- ============ 多选底部操作栏 ============ -->
  <div class="multi-bar" id="multiBar">
    <span class="count" id="selectedCount">已选择 0 张</span>
    <div class="actions">
      <button class="nav-btn hidden" id="batchDeleteBtn" title="删除所选">
        <svg class="icon-lg" data-i="trash"></svg>
      </button>
      <button class="nav-btn" id="batchDownloadBtn" title="批量下载">
        <svg class="icon-lg" data-i="download"></svg>
      </button>
    </div>
  </div>

  <!-- 框选矩形 -->
  <div class="selection-box" id="selectionBox"></div>

  <!-- ============ 上传进度：按钮右下角小圆圈 + 悬停详情 ============ -->
  <div class="up-indicator hidden" id="upIndicator">
    <svg viewBox="0 0 36 36" class="up-ring">
      <circle class="up-ring-bg" cx="18" cy="18" r="15" />
      <circle class="up-ring-fg" id="upRing" cx="18" cy="18" r="15" />
    </svg>
    <span class="up-pct" id="upPct">0</span>
    <div class="up-tip" id="upTip">
      <div class="up-tip-step" id="upTipStep">准备中</div>
      <div class="up-tip-file" id="upTipFile">待上传</div>
      <div class="up-tip-stat">
        <span class="ok">成功 <b id="upDone">0</b></span>
        <span class="dup">重复 <b id="upSkipped">0</b></span>
        <span class="bad">失败 <b id="upFailed">0</b></span>
      </div>
    </div>
  </div>

  <!-- ============ Lightbox ============ -->
  <div class="lightbox" id="lightbox">
    <div class="lb-top">
      <div class="lb-top-left">
        <span class="lb-counter" id="lbCounter">1 / 1</span>
      </div>
      <div class="lb-top-actions">
        <button class="lb-btn" id="lbMoreBtn" title="更多">
          <svg class="icon-lg" data-i="more"></svg>
        </button>
        <button class="lb-btn" id="lbCloseBtn" title="关闭">
          <svg class="icon-lg" data-i="x"></svg>
        </button>
      </div>
    </div>

    <div class="lb-stage" id="lbStage">
      <div class="lb-media-wrap" id="lbMediaWrap">
        <img class="lb-img" id="lbImg" alt="预览图片" draggable="false" />
        <video class="lb-img" id="lbVid" style="display:none" muted loop playsinline autoplay preload="metadata"
          disablepictureinpicture controlslist="nodownload nofullscreen noremoteplayback" draggable="false"></video>
      </div>
    </div>

    <div class="gesture-icon gi-left" id="giLeft">
      <div class="gi-circle"><svg class="icon" data-i="heart"></svg></div>
    </div>
    <div class="gesture-icon gi-right" id="giRight">
      <div class="gi-circle"><svg class="icon" data-i="x-circle"></svg></div>
    </div>
    <div class="gesture-icon gi-up" id="giUp">
      <div class="gi-circle"><svg class="icon" data-i="more"></svg></div>
    </div>
    <div class="gesture-icon gi-down" id="giDown">
      <div class="gi-circle"><svg class="icon" data-i="download"></svg></div>
    </div>

    <div class="lb-dots" id="lbDots"></div>
  </div>

  <!-- ============ 更多菜单 ============ -->
  <div class="mask" id="menuMask"></div>
  <div class="menu" id="menu">
    <div class="grab"></div>
    <button class="menu-item" id="menuCopyImage">
      <svg class="icon" data-i="copy"></svg><span>复制原图</span>
    </button>
    <button class="menu-item" id="menuCopyLink">
      <svg class="icon" data-i="link"></svg><span>复制直链</span>
    </button>
    <button class="menu-item" id="menuShare">
      <svg class="icon" data-i="share"></svg><span>转发分享</span>
    </button>
    <button class="menu-item" id="menuGoogle">
      <svg class="icon" data-i="search"></svg><span>使用谷歌搜图</span>
      <svg class="icon ext" data-i="external"></svg>
    </button>
    <div class="menu-divider"></div>
    <button class="menu-item menu-cancel" id="menuCancel"><span>取消</span></button>
  </div>

  <!-- Toast -->
  <div class="toasts" id="toasts"></div>

  <script src="shared.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { }));
  </script>
</body>

</html>
