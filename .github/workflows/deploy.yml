name: Deploy Infoto to Cloudflare Workers

on:
  workflow_dispatch:   # 手动触发（配好 Secrets 后手动跑）
  push:
    branches: [main]   # push 到 main 自动部署

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 首次部署：自动创建 KV namespace 并回填 wrangler.toml（幂等，之后跳过）
      - name: Ensure KV namespace (PHOTOS)
        run: |
          if grep -q 'id = "REPLACE_WITH_KV_ID"' wrangler.toml; then
            echo "Creating KV namespace PHOTOS..."
            KV_JSON=$(npx wrangler kv namespace create PHOTOS --json 2>&1)
            echo "$KV_JSON"
            KV_ID=$(echo "$KV_JSON" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{console.log(JSON.parse(d).id)}catch(e){console.log('')}})")
            if [ -z "$KV_ID" ]; then
              echo "::error::Failed to parse KV id. Check CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets."
              exit 1
            fi
            sed -i "s/id = \"REPLACE_WITH_KV_ID\"/id = \"$KV_ID\"/" wrangler.toml
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add wrangler.toml
            git commit -m "chore: init KV namespace PHOTOS (id=$KV_ID)" || true
            git push origin HEAD:main || true
          else
            echo "KV namespace already configured, skipping."
          fi
        shell: bash

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy

      - name: Output worker URL
        run: |
          echo "✅ Deployed. 访问你的 Worker 域名，或按 wrangler.toml 中配置的自定义域名。"
