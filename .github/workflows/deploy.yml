name: Deploy Infoto

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check syntax
        run: npm run check

      - name: Determine deployment name
        id: meta
        shell: bash
        run: |
          REF="${{ github.ref }}"
          if [[ "$REF" == refs/tags/v* ]]; then
            NAME="infoto"
          else
            NAME="infoto-dev"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Deploy target: $NAME"

      - name: Create / get D1 database
        id: d1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          NAME="${{ steps.meta.outputs.name }}"
          # 列出所有 D1，查是否已存在同名
          LIST_JSON=$(npx wrangler d1 list --json 2>/dev/null || echo "[]")
          D1_ID=$(node -e '
            try {
              const list = JSON.parse(process.argv[1] || "[]");
              const hit = list.find(x => x.name === process.argv[2]);
              process.stdout.write((hit && (hit.uuid || hit.id)) || "");
            } catch(e) { process.stdout.write(""); }
          ' "$LIST_JSON" "$NAME")

          if [ -z "$D1_ID" ]; then
            echo "D1 '$NAME' not found, creating..."
            CREATE_JSON=$(npx wrangler d1 create "$NAME" --json 2>/dev/null || echo "{}")
            D1_ID=$(node -e '
              try {
                const j = JSON.parse(process.argv[1] || "{}");
                process.stdout.write((j && (j.uuid || j.id)) || "");
              } catch(e) { process.stdout.write(""); }
            ' "$CREATE_JSON")
            if [ -z "$D1_ID" ]; then
              echo "::error::Failed to create D1 database via wrangler. Response: $CREATE_JSON"
              exit 1
            fi
            echo "Created D1: $NAME ($D1_ID)"
          else
            echo "Found existing D1: $NAME ($D1_ID)"
          fi
          echo "d1_id=$D1_ID" >> "$GITHUB_OUTPUT"

      - name: Patch wrangler.toml (D1 id + worker name)
        shell: bash
        env:
          WORKER: ${{ steps.meta.outputs.name }}
          D1_ID: ${{ steps.d1.outputs.d1_id }}
        run: |
          node -e "
            const fs=require('fs');
            let cfg = fs.readFileSync('wrangler.toml','utf8');
            cfg = cfg.replace(/^name = \".*\"/m, 'name = \"' + process.env.WORKER + '\"');
            cfg = cfg.replace(/database_id = \".*\"/m, 'database_id = \"' + process.env.D1_ID + '\"');
            fs.writeFileSync('wrangler.toml', cfg);
          "
          echo "--- Final wrangler.toml ---"
          cat wrangler.toml

      - name: Apply D1 schema
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          NAME="${{ steps.meta.outputs.name }}"
          npx wrangler d1 execute "$NAME" --remote --file=./src/db/schema.sql \
            || echo "::warning::D1 schema apply skipped or partially applied (tables may already exist)"

      - name: Deploy Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy

      - name: Sync secrets (if present)
        shell: bash
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          put_secret() {
            local NAME="$1" VAL="$2"
            if [ -n "$VAL" ] && [ "$VAL" != "null" ]; then
              printf '%s' "$VAL" | npx wrangler secret put "$NAME" 2>&1 || true
              echo "secret $NAME synced (or already exists)"
            else
              echo "secret $NAME not set - skipped"
            fi
          }
          put_secret TC_SECRET "${{ secrets.TC_SECRET }}"
          put_secret ADMIN_PASSWORD "${{ secrets.ADMIN_PASSWORD }}"
          put_secret TURNSTILE_SITE_KEY "${{ secrets.TURNSTILE_SITE_KEY }}"
          put_secret TURNSTILE_SECRET_KEY "${{ secrets.TURNSTILE_SECRET_KEY }}"

      - name: Show URL
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          NAME="${{ steps.meta.outputs.name }}"
          SUBDOMAIN=$(npx wrangler workers subdomain get --json 2>/dev/null | node -e '
            try{const j=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write((j&&j.subdomain)||"")}catch(e){}
          ' || echo "")
          if [ -n "$SUBDOMAIN" ]; then
            URL="https://${NAME}.${SUBDOMAIN}.workers.dev"
          else
            URL="(custom domain or subdomain unavailable)"
          fi
          echo ""
          echo "================================"
          echo "✅ Deployment Complete!"
          echo "Worker:  $NAME"
          echo "URL:     $URL"
          echo "================================"
          echo ""