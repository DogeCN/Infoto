name: deploy

# Pipeline: checkout -> install deps -> build SPA -> ensure same-name D1 -> patch
# wrangler.toml -> apply schema (idempotent) -> wrangler deploy -> inject secrets.
#
# A tag push deploys production (the real Turnstile key/secret); any other push
# deploys the same Worker under the test Turnstile key/secret so the e2e harness's
# fake token passes. dist/ is not committed — this workflow builds it.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      deploy_name:
        description: 'Deploy target name (Worker & D1 share this name)'
        required: true
        type: string
      CLOUDFLARE_API_TOKEN:
        description: 'Override repo secret CLOUDFLARE_API_TOKEN (optional)'
        required: false
        type: string
      CLOUDFLARE_ACCOUNT_ID:
        description: 'Override repo secret CLOUDFLARE_ACCOUNT_ID (optional)'
        required: false
        type: string
      TURNSTILE_SITE_KEY:
        description: 'Override repo variable TURNSTILE_SITE_KEY (optional)'
        required: false
        type: string
      TURNSTILE_SECRET_KEY:
        description: 'Override repo secret TURNSTILE_SECRET_KEY (optional)'
        required: false
        type: string

env:
  DEPLOY_NAME: ${{ inputs.deploy_name || (github.ref_type == 'tag' && 'infoto' || 'infoto-dev') }}
  CLOUDFLARE_API_TOKEN: ${{ inputs.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ inputs.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}

permissions:
  contents: read

# One deploy at a time per ref: two overlapping runs would race on wrangler deploy
# and on the wrangler.toml rewrite below.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Quality gate runs first: a broken lint/type/test state never deploys.
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # One npm workspace install covers Worker deps (hono, wrangler from the root)
      # and frontend deps (web/) — a single lockfile at the repo root. wrangler runs
      # through npx, so it stays the pinned devDependency rather than a global copy.
      - name: Install dependencies
        run: npm ci

      - name: Build SPA into dist/
        run: |
          npm run build
          test -f dist/index.html
          echo "dist/ built: $(find dist -type f | wc -l) files"

      - name: Ensure same-name D1 exists
        run: |
          get_db_id() {
            npx wrangler d1 list --json 2>/dev/null | node -e '
              let d = "";
              process.stdin.on("data", c => d += c).on("end", () => {
                const m = d.match(/\[[\s\S]*\]/);
                if (!m) { console.error("no JSON array in wrangler output"); process.exit(1); }
                const list = JSON.parse(m[0]);
                const hit = list.find(x => x.name === process.env.DEPLOY_NAME);
                console.log(hit ? hit.uuid : "");
              });'
          }
          DB_ID="$(get_db_id)"
          if [ -z "$DB_ID" ]; then
            echo "D1 '$DEPLOY_NAME' not found — creating"
            npx wrangler d1 create "$DEPLOY_NAME"
            DB_ID="$(get_db_id)"
          fi
          if [ -z "$DB_ID" ]; then
            echo "::error::failed to resolve database_id for '$DEPLOY_NAME'"
            exit 1
          fi
          echo "DB_ID=$DB_ID" >> "$GITHUB_ENV"
          echo "D1 '$DEPLOY_NAME' ready (database_id resolved)"

      - name: Patch wrangler.toml
        run: |
          sed -i "s/^name = .*/name = \"$DEPLOY_NAME\"/" wrangler.toml
          sed -i "s/^database_name = .*/database_name = \"$DEPLOY_NAME\"/" wrangler.toml
          sed -i "s/^database_id = .*/database_id = \"$DB_ID\"/" wrangler.toml
          # The site key must match the secret injected below: a tag push uses the
          # real key, a branch push the Cloudflare test key.
          SITE_KEY="${{ inputs.TURNSTILE_SITE_KEY }}"
          if [ -z "$SITE_KEY" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              SITE_KEY="${{ vars.TURNSTILE_SITE_KEY }}"
            else
              SITE_KEY="1x00000000000000000000AA"
            fi
          fi
          if [ -n "$SITE_KEY" ]; then
            printf '\n[vars]\nTURNSTILE_SITE_KEY = "%s"\n' "$SITE_KEY" >> wrangler.toml
          fi
          # MEDIA_HOST_URL is the facade's public hostname, not a credential, so it
          # lives in plain-text [vars] (env.MEDIA_HOST_URL is read the same way).
          # It is required for every deployed target: an unset value would leave the
          # Worker with no facade address, which the media URL guard treats as a
          # configuration error rather than defaulting to the local simulation.
          MEDIA_HOST_URL_VALUE="${{ vars.MEDIA_HOST_URL }}"
          if [ -z "$MEDIA_HOST_URL_VALUE" ]; then
            echo "::error::vars.MEDIA_HOST_URL is empty — set the repo variable to the facade origin (e.g. https://tc.example). Refusing to deploy without a media host."
            exit 1
          fi
          printf 'MEDIA_HOST_URL = "%s"\n' "$MEDIA_HOST_URL_VALUE" >> wrangler.toml
          cat wrangler.toml

      - name: Apply schema when missing
        run: |
          CHECK="$(npx wrangler d1 execute "$DEPLOY_NAME" --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name='users'" --json)"
          COUNT="$(printf '%s' "$CHECK" | node -e '
            let d = "";
            process.stdin.on("data", c => d += c).on("end", () => {
              try {
                const m = d.match(/\[[\s\S]*\]/);
                if (!m) throw new Error("no JSON array in output");
                console.log(JSON.parse(m[0])[0].results.length);
              } catch { console.log("ERR"); }
            });')"
          if [ "$COUNT" = "ERR" ]; then
            echo "::error::could not read the table list — refusing to guess the schema state"
            exit 1
          fi
          if [ "$COUNT" = "0" ]; then
            echo "Tables missing — applying schema.sql"
            npx wrangler d1 execute "$DEPLOY_NAME" --remote --file=schema.sql
          else
            echo "Schema already applied (users table exists) — skipping"
          fi

      - name: Deploy Worker
        run: npx wrangler deploy

      # A branch deployment runs against the always-pass test secret, which is the
      # only secret whose tokens the test site key above accepts. Must stay in sync
      # with ALWAYS_PASS_SECRET in src/worker/turnstile.ts (the Worker short-circuits
      # siteverify on an exact match).
      - name: Inject Turnstile test secret (non-production)
        if: github.ref_type != 'tag'
        run: |
          printf '%s' "1x0000000000000000000000000000000AA" | npx wrangler secret put TURNSTILE_SECRET_KEY

      - name: Inject Turnstile secret (production)
        if: github.ref_type == 'tag'
        env:
          TURNSTILE_SECRET_VALUE: ${{ inputs.TURNSTILE_SECRET_KEY || secrets.TURNSTILE_SECRET_KEY }}
        run: |
          if [ -z "$TURNSTILE_SECRET_VALUE" ]; then
            echo "::error::repo secret TURNSTILE_SECRET_KEY is empty"
            exit 1
          fi
          printf '%s' "$TURNSTILE_SECRET_VALUE" | npx wrangler secret put TURNSTILE_SECRET_KEY
