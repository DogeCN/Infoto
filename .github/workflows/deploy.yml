name: Deploy Infoto to Cloudflare Workers

on:
  workflow_dispatch:   # 手动触发（配好 Variables 后手动跑）
  push:
    branches: [main]   # push 到 main 自动部署

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy variants defined in Repository Variables (KV, KV_1, KV1...)
        env:
          VARS_JSON: ${{ toJson(vars) }}
        run: |
          set -e
          node scripts/deploy-variants.js