name: tmp-crawl-l

# TEMPORARY diagnostic: fetch https://dev.infoto.cc.cd/l/b from CI (a datacenter IP,
# no cookies, no browser) to see whether non-browser fetchers can retrieve media —
# the same conditions Google's URL fetcher runs under. Delete after reading the run.

on: workflow_dispatch

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch /l/b (no UA)
        run: |
          curl -sS -D /tmp/h1.txt -o /tmp/b1.bin "https://dev.infoto.cc.cd/l/b" || true
          echo "--- headers ---"; cat /tmp/h1.txt
          echo "--- bytes: $(stat -c%s /tmp/b1.bin) ---"
          echo "--- first 16 bytes ---"; head -c 16 /tmp/b1.bin | xxd || true

      - name: Fetch /l/b (browser UA)
        run: |
          code=$(curl -sS -o /tmp/b2.bin -w "%{http_code} %{content_type} %{size_download}" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36" \
            "https://dev.infoto.cc.cd/l/b") || true
          echo "--- result: $code ---"
          echo "--- first 16 bytes ---"; head -c 16 /tmp/b2.bin | xxd || true

      - name: Fetch /robots.txt
        run: |
          curl -sS -o - -w "\nstatus: %{http_code} %{content_type}\n" "https://dev.infoto.cc.cd/robots.txt" | head -c 400 || true
